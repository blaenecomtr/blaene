<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blaene Kargo Bilgisi</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .wrap {
      max-width: 760px;
      margin: 24px auto;
      padding: 0 14px;
    }
    .card {
      background: #fff;
      border: 1px solid #dbe1ea;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(2, 6, 23, 0.06);
    }
    .head {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      height: 34px;
      width: auto;
      display: block;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }
    .row {
      margin: 10px 0;
      font-size: 16px;
      line-height: 1.45;
      word-break: break-word;
    }
    .label {
      font-weight: 700;
      display: inline-block;
      min-width: 90px;
    }
    .note {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 700;
      color: #0b3a66;
    }
    .note a {
      color: #0b3a66;
      text-decoration: underline;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="head">
        <img class="logo" src="/logo/blaene-logo.png" alt="Blaene" />
        <h1>Kargo Bilgisi</h1>
      </div>
      <div class="row"><span class="label">Ad Soyad:</span> <span id="name">-</span></div>
      <div class="row"><span class="label">Telefon:</span> <span id="phone">-</span></div>
      <div class="row"><span class="label">Adres:</span> <span id="address">-</span></div>
      <div class="note">Not: WhatsApp destek hattı <a id="support-link" href="#">0532 054 0019</a></div>
    </section>
  </main>

  <script>
    (function () {
      function parseQueryParam(key) {
        var query = String(window.location.search || '');
        if (query.charAt(0) === '?') query = query.slice(1);
        var parts = query.split('&');
        for (var i = 0; i < parts.length; i++) {
          var kv = parts[i].split('=');
          if (kv[0] === key) return decodeURIComponent(kv.slice(1).join('=') || '');
        }
        return '';
      }

      var name = (parseQueryParam('n') || '-').toString();
      var phone = (parseQueryParam('p') || '-').toString();
      var address = (parseQueryParam('a') || '-').toString();
      var orderNo = (parseQueryParam('o') || '-').toString();
      var city = (parseQueryParam('c') || '-').toString();
      var tracking = (parseQueryParam('t') || '-').toString();
      var date = (parseQueryParam('d') || '-').toString();

      document.getElementById('name').textContent = name;
      document.getElementById('phone').textContent = phone;
      document.getElementById('address').textContent = address;

      var supportNumber = '905320540019';
      var waLines = [
        'Merhaba Blaene destek,',
        'Sipariş No: ' + orderNo,
        'Müşteri: ' + name,
        'Telefon: ' + phone,
        'Adres: ' + address,
        'Şehir: ' + city,
        'Takip: ' + tracking,
        'Tarih: ' + date
      ];
      var waText = waLines.join('\n');
      if (waText.length > 450) waText = waText.slice(0, 447) + '...';

      var supportLink = document.getElementById('support-link');
      supportLink.setAttribute('href', 'https://wa.me/' + supportNumber + '?text=' + encodeURIComponent(waText));
    })();
  </script>
</body>
</html>
